services:
  - type: web
    name: portfolio-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm --prefix frontend run build
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: BACKEND_PUBLIC_URL
        sync: false
